name: Robustecer ALUCIA escenarios

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/robustecer-alucia-escenarios.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Hacer deteccion independiente de clases React
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('alucia-enhancements.js')
          s=p.read_text()
          old="const btn=e.target.closest('.receipt-demo-options button,.demo-scenario-options button');"
          new="const btn=e.target.closest('button');"
          if old not in s:
              raise SystemExit('No se encontró listener esperado')
          p.write_text(s.replace(old,new,1))
          PY
          node --check alucia-enhancements.js
      - name: Guardar
        run: |
          git config user.name 'SAEZ1205'
          git config user.email 'saez123m@gmail.com'
          git add alucia-enhancements.js
          git commit -m 'Reiniciar LucIA al cambiar cualquier demo' || exit 0
          git push origin main
