name: Reparar pantalla azul

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reparar-pantalla-azul.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurar bundle FINAL exacto
        run: |
          git clone --depth 1 https://github.com/SAEZ1205/1retomovistar.git "$RUNNER_TEMP/origen"
          SRC="$RUNNER_TEMP/origen/MI_RECIBO_INTELIGENTE_FINAL_IGUAL_SITE"
          test -f "$SRC/assets/index-CfBV2SCI.js"
          test -f "$SRC/dist/assets/index-CfBV2SCI.js"
          cp "$SRC/assets/index-CfBV2SCI.js" assets/index-CfBV2SCI.js
          cp "$SRC/dist/assets/index-CfBV2SCI.js" dist/assets/index-CfBV2SCI.js

      - name: Verificar sintaxis y build
        run: |
          node --check assets/index-CfBV2SCI.js
          node --check alucia-voice.js
          node --check lucia-backend-v2.mjs
          npm run build

      - name: Prueba real en navegador
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node server.mjs > /tmp/mi-recibo.log 2>&1 &
          SERVER_PID=$!
          sleep 2
          node - <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:390,height:844}});
            const errors=[];
            page.on('pageerror', e => errors.push(String(e)));
            await page.goto('http://127.0.0.1:3000',{waitUntil:'networkidle'});
            await page.waitForTimeout(1200);
            const rootChildren = await page.locator('#root').evaluate(el=>el.children.length);
            const bodyText = (await page.locator('body').innerText()).trim();
            console.log('rootChildren=',rootChildren,'bodyLength=',bodyText.length);
            if(rootChildren < 1 || bodyText.length < 80){
              console.error('La interfaz no renderizó correctamente');
              console.error('pageerrors=',errors);
              await browser.close();
              process.exit(1);
            }
            if(errors.length) console.log('Errores no fatales:',errors);
            await page.screenshot({path:'/tmp/interfaz-ok.png',fullPage:true});
            await browser.close();
          })();
          JS
          kill $SERVER_PID || true

      - name: Guardar reparación en main
        run: |
          git config user.name 'SAEZ1205'
          git config user.email 'saez123m@gmail.com'
          git add assets/index-CfBV2SCI.js dist/assets/index-CfBV2SCI.js dist/index.html
          git commit -m 'Reparar pantalla azul con bundle final original' || exit 0
          git push origin main
