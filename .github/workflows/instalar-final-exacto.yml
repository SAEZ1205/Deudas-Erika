name: Instalar interfaz final exacta

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instalar-final-exacto.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copiar interfaz FINAL recuperada
        run: |
          git clone --depth 1 https://github.com/SAEZ1205/1retomovistar.git "$RUNNER_TEMP/origen"
          SRC="$RUNNER_TEMP/origen/MI_RECIBO_INTELIGENTE_FINAL_IGUAL_SITE"
          test -f "$SRC/assets/index-CfBV2SCI.js"
          test -f "$SRC/assets/index-eCgd0yV6.css"
          test -f "$SRC/index.html"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a "$SRC"/. .
          rm -rf FUENTE_BASE_ANTIGUA_NO_USADA_EN_LA_DEMO

      - name: Conectar LucIA sin cambiar la interfaz
        env:
          OLD_BLOCK_B64: ''
          NEW_BLOCK_B64: ''
        run: |
          python - <<'PY2'
          import os, base64
          from pathlib import Path
          old=base64.b64decode(os.environ['OLD_BLOCK_B64']).decode()
          new=base64.b64decode(os.environ['NEW_BLOCK_B64']).decode()
          for fp in [Path('assets/index-CfBV2SCI.js'), Path('dist/assets/index-CfBV2SCI.js')]:
              s=fp.read_text()
              if old not in s:
                  raise SystemExit(f'No encontré bloque exacto a parchear en {fp}')
              s=s.replace(old,new,1)
              q='!e.handoff&&!e.showFeedback&&e.offerStatus===`locked`&&(0,p.jsx)(D,{questions:e.questions,onAsk:e.onAsk})'
              q2='!e.handoff&&e.offerStatus===`locked`&&e.messages.length===1&&(0,p.jsx)(D,{questions:e.questions,onAsk:e.onAsk})'
              if q not in s:
                  raise SystemExit('No encontré preguntas rápidas')
              s=s.replace(q,q2,1)
              offer='e.offerStatus!==`locked`&&(0,p.jsxs)(`section`,{className:`offer-card`,children:[(0,p.jsx)(`small`,{children:`OFERTA CONTEXTUAL`})'
              offer2='e.offerStatus!==`locked`&&(0,p.jsxs)(`section`,{className:`offer-card`,children:[(0,p.jsx)(`img`,{src:`/promos/inicio-postpago.png`,alt:`Oferta Movistar`,style:{width:`100%`,height:`110px`,objectFit:`cover`,borderRadius:`14px`,marginBottom:`10px`}}),(0,p.jsx)(`small`,{children:`OFERTA CONTEXTUAL`})'
              if offer not in s:
                  raise SystemExit('No encontré tarjeta de oferta')
              s=s.replace(offer,offer2,1)
              fp.write_text(s)
          PY2

      - name: Agregar backend local Gemini
        run: |
          echo '' | base64 -d > lucia-backend.mjs
          echo '' | base64 -d > run-full.mjs
          echo '' | base64 -d > package.json
          echo 'IyBDT1BJQSBFU1RFIEFSQ0hJVk8gQ09NTyAuZW52LmxvY2FsIFkgUEVHQSBUVSBLRVkgU09MTyBFTiBUVSBQQwpHRU1JTklfQVBJX0tFWT1QRUdBX0FRVUlfVFVfQVBJX0tFWQpHRU1JTklfTU9ERUw9Z2VtaW5pLTIuNS1mbGFzaApMVUNJQV9QT1JUPTg3ODcK' | base64 -d > .env.local.example
          echo '' | base64 -d > EMPIEZA_AQUI.txt
          cat > .gitignore <<'EOF'
          .env
          .env.local
          node_modules/
          .DS_Store
          EOF

      - name: Verificar antes de guardar
        run: |
          node --check lucia-backend.mjs
          node --check run-full.mjs
          node --check server.mjs
          grep -q 'http://127.0.0.1:8787/api/lucia' assets/index-CfBV2SCI.js
          grep -q 'e.messages.length===1' assets/index-CfBV2SCI.js
          grep -q '/promos/inicio-postpago.png' assets/index-CfBV2SCI.js
          npm run build

      - name: Guardar DIRECTO en main
        run: |
          git config user.name 'SAEZ1205'
          git config user.email 'saez123m@gmail.com'
          git add -A
          git commit -m 'Usar interfaz final exacta con LucIA backend' || exit 0
          git push origin main
