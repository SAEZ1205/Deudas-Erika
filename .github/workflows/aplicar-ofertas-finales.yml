name: Aplicar ofertas finales por escenario

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aplicar-ofertas-finales.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mapear ofertas y banners sin cambiar UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          backend = Path('lucia-backend-v2.mjs')
          s = backend.read_text()
          s = re.sub(r"const OFFERS=\[.*?\n\];", """const OFFERS=[
            {id:'POST-170',name:'170 GB',price:45.90,benefit:'20 GB mas',bonus:'100 GB por 7 meses',banner:'/promos/plan-30gb.png'},
            {id:'POST-250',name:'250 GB',price:49.90,benefit:'100 GB mas',bonus:'Movistar TV app Lite',banner:'/promos/inicio-cambiate.png'},
            {id:'POST-280',name:'280 GB',price:55.90,benefit:'130 GB mas',bonus:'Movistar TV app Lite',banner:'/promos/inicio-postpago.png'},
            {id:'POST-500',name:'500 GB',price:59.90,benefit:'350 GB mas',bonus:'Movistar TV app Lite',banner:'/promos/inicio-postpago.png'}
          ];""", s, count=1, flags=re.S)
          s = re.sub(r"function offerFor\(scenario\)\{.*?\}", "function offerFor(scenario){return scenario==='discount'?OFFERS[0]:scenario==='proration'?OFFERS[1]:scenario==='reconnection'?OFFERS[2]:OFFERS[3];}", s, count=1)
          backend.write_text(s)

          offer_map = """et={current:{id:`POST-500`,name:`500 GB`,price:59.9,duration:`al mes`,reason:`500 GB en alta velocidad · Movistar TV app Lite`,banner:`/promos/inicio-postpago.png`},discount:{id:`POST-170`,name:`170 GB`,price:45.9,duration:`al mes`,reason:`20 GB más · recomendación después de resolver tu duda`,banner:`/promos/plan-30gb.png`},proration:{id:`POST-250`,name:`250 GB`,price:49.9,duration:`al mes`,reason:`100 GB más · Movistar TV app Lite`,banner:`/promos/inicio-cambiate.png`},reconnection:{id:`POST-280`,name:`280 GB`,price:55.9,duration:`al mes`,reason:`130 GB más · Movistar TV app Lite`,banner:`/promos/inicio-postpago.png`}},"""

          for fp in [Path('assets/index-CfBV2SCI.js'), Path('dist/assets/index-CfBV2SCI.js')]:
              if not fp.exists():
                  continue
              js = fp.read_text()
              old = "var w=b.benefits,ee=b.offer,te=b.usage_categories.map"
              new = "var w=b.benefits,ee=b.offer," + offer_map + "te=b.usage_categories.map"
              if old in js and "POST-500" not in js:
                  js = js.replace(old, new, 1)
              js = js.replace("offer:ee,handoff:g", "offer:et[i.id]??ee,handoff:g", 1)
              js = js.replace("src:`/promos/inicio-postpago.png`,alt:`Oferta Movistar`", "src:e.offer.banner??`/promos/inicio-postpago.png`,alt:`Oferta Movistar`", 1)
              js = js.replace("children:`Simular contratación`", "children:`Mejorar mi plan`", 1)
              js = js.replace("children:`✓ Contratación simulada; no se realizó ningún cobro.`", "children:`✓ Oferta seleccionada. El flujo de contratación se implementará después.`", 1)
              js = js.replace("text:Ot(ee),source:`Catálogo controlado · Oferta O-87`", "text:`Esta oferta quedó seleccionada. Por ahora el siguiente paso es el botón Mejorar mi plan; el flujo de contratación se implementará después.`,source:`Catálogo de ofertas · demo académica`", 1)
              fp.write_text(js)
          PY

      - name: Verificar mapeo
        run: |
          grep -q "POST-500" lucia-backend-v2.mjs
          grep -q "POST-500" assets/index-CfBV2SCI.js
          grep -q "Mejorar mi plan" assets/index-CfBV2SCI.js
          grep -q "e.offer.banner" assets/index-CfBV2SCI.js
          node --check lucia-backend-v2.mjs
          npm run build

      - name: Guardar en main
        run: |
          git config user.name 'SAEZ1205'
          git config user.email 'saez123m@gmail.com'
          git add lucia-backend-v2.mjs assets/index-CfBV2SCI.js dist/assets/index-CfBV2SCI.js
          git commit -m 'Mapear ofertas 170 250 280 500 con banners' || exit 0
          git push origin main
