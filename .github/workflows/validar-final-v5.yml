name: Validar final V5

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validar-final-v5.yml']
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build y archivos
        run: |
          node --check alucia-final-overrides.js
          npm run build
          for f in lucia-normal-500.webp lucia-discount-170.webp lucia-proration-250.webp lucia-reconnection-280.webp; do test -s "dist/promos/$f"; done
          test "$(find recibos/{current,proration,reconnection,discount} -name '*.pdf' | wc -l)" -eq 24
      - name: Navegador
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
          node lucia-backend-v2.mjs >/tmp/lucia.log 2>&1 &
          PORT=3000 node server.mjs >/tmp/app.log 2>&1 &
          sleep 2
          timeout 45s node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:390,height:844}});
            const errs=[];p.on('pageerror',e=>errs.push(String(e)));
            await p.goto('http://127.0.0.1:3000',{waitUntil:'networkidle'});
            if((await p.locator('#root').evaluate(e=>e.children.length))<1)throw Error('root vacío');
            await p.locator('#alucia-smart-trigger').click();
            await p.waitForSelector('.alucia-smart-chat');
            const hello=await p.locator('.alucia-scroll').innerText();
            if(!hello.includes('¿Qué quieres revisar de tu recibo?'))throw Error('saludo incorrecto: '+hello);
            if(/Ya cargué la demo|Pregúntame como hablas|Escenario activo/i.test(hello))throw Error('texto técnico viejo visible');
            await p.locator('.alucia-input').fill('quiero ver una oferta');await p.locator('.alucia-send').click();await p.waitForTimeout(700);
            const src=await p.locator('.alucia-offer-banner').getAttribute('src');if(!src.includes('lucia-normal-500.webp'))throw Error('banner incorrecto: '+src);
            for(const f of ['lucia-normal-500.webp','lucia-discount-170.webp','lucia-proration-250.webp','lucia-reconnection-280.webp']){
              const r=await p.request.get('http://127.0.0.1:3000/promos/'+f);if(!r.ok())throw Error('no carga '+f);
            }
            const pdf=await p.request.get('http://127.0.0.1:3000/recibos/reconnection/recibo-agosto-2026.pdf');if(!pdf.ok()||(await pdf.body()).length<2500)throw Error('PDF inválido');
            if(errs.length)throw Error(errs.join(' | '));
            console.log('OK: UI, saludo, banners finales y PDFs');await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
