name: Validar ALUCIA integral

on:
  push:
    branches: [main]
    paths:
      - 'alucia-enhancements.js'
      - 'alucia-enhancements.css'
      - 'index.html'
      - 'scripts/build-static.mjs'
      - 'lucia-backend-v2.mjs'
      - '.github/workflows/validar-alucia-integral.yml'
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sintaxis y build
        run: |
          node --check alucia-enhancements.js
          node --check lucia-backend-v2.mjs
          node --check server.mjs
          npm run build
          test -f dist/alucia-enhancements.js
          test -f dist/alucia-enhancements.css
          test -f recibos/current/recibo-agosto-2026.pdf
          test -f recibos/proration/recibo-agosto-2026.pdf
          test -f recibos/reconnection/recibo-agosto-2026.pdf
          test -f recibos/discount/recibo-agosto-2026.pdf

      - name: Instalar navegador de prueba
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Probar interfaz y chat en navegador real
        run: |
          node lucia-backend-v2.mjs > /tmp/lucia.log 2>&1 &
          LUCIA_PID=$!
          PORT=3000 node server.mjs > /tmp/app.log 2>&1 &
          APP_PID=$!
          sleep 2
          node - <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:3000',{waitUntil:'networkidle'});
            await page.waitForTimeout(800);
            const body=(await page.locator('body').innerText()).trim();
            if(body.length<100) throw new Error('La interfaz no renderizó contenido suficiente');

            const candidates=page.locator('button, [role="button"]');
            const n=await candidates.count(); let opened=false;
            for(let i=0;i<n;i++){
              const b=candidates.nth(i); if(!(await b.isVisible())) continue;
              const txt=((await b.innerText().catch(()=>''))||'').trim();
              const aria=(await b.getAttribute('aria-label'))||'';
              const hasLuciaImg=await b.locator('img[src*="lucia" i]').count();
              if(/lucia|asistente|ayuda/i.test(txt+' '+aria) || hasLuciaImg){
                await b.click().catch(()=>{}); await page.waitForTimeout(300);
                if(await page.locator('.alucia-smart-chat').count()){opened=true;break;}
              }
            }
            if(!opened){
              const luciaImg=page.locator('img[src*="lucia" i]').filter({visible:true}).last();
              if(await luciaImg.count()){await luciaImg.click().catch(()=>{});await page.waitForTimeout(400);opened=await page.locator('.alucia-smart-chat').count()>0;}
            }
            if(!opened) throw new Error('No pude abrir el chat LucIA desde la interfaz final');
            if(await page.locator('.alucia-input').count()!==1) throw new Error('No apareció input ALUCIA');

            await page.locator('.alucia-input').fill('oe xq me vino asi');
            await page.locator('.alucia-send').click();
            await page.waitForTimeout(1000);
            const chatText=await page.locator('.alucia-scroll').innerText();
            if(!/recibo|plan|cobro|mantuvo|variaci/i.test(chatText)) throw new Error('LucIA no respondió al mensaje');

            await page.locator('.alucia-input').fill('quiero ver una oferta');
            await page.locator('.alucia-send').click();
            await page.waitForTimeout(900);
            if(await page.locator('.alucia-offer-banner').count()<1) throw new Error('No apareció banner de oferta');
            if(await page.getByRole('button',{name:'Mejorar mi plan'}).count()<1) throw new Error('No apareció Mejorar mi plan');
            if(errors.length) console.log('Page errors:',errors);
            await page.screenshot({path:'/tmp/alucia-integral.png',fullPage:true});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          kill $APP_PID || true
          kill $LUCIA_PID || true
