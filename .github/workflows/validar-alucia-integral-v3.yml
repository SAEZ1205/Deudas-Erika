name: Validar ALUCIA integral V4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validar-alucia-integral-v3.yml'
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build y estructura
        run: |
          node --check alucia-enhancements.js
          node --check alucia-final-overrides.js
          node --check alucia-trigger.js
          node --check lucia-backend-v2.mjs
          npm run build
          test -f dist/alucia-final-overrides.js
          for f in lucia-normal-500.webp lucia-discount-170.webp lucia-proration-250.webp lucia-reconnection-280.webp; do
            test -s "promos/$f"
            test -s "dist/promos/$f"
          done
          for s in current proration reconnection discount; do
            test "$(find recibos/$s -name '*.pdf' | wc -l)" -eq 6
            test -s "recibos/$s/recibo-agosto-2026.pdf"
          done
      - name: Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Probar UI, chat, banners, reset y PDF
        run: |
          node lucia-backend-v2.mjs >/tmp/lucia.log 2>&1 & LUCIA_PID=$!
          PORT=3000 node server.mjs >/tmp/app.log 2>&1 & APP_PID=$!
          sleep 2
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:390,height:844}});
            const errors=[];p.on('pageerror',e=>errors.push(String(e)));
            await p.goto('http://127.0.0.1:3000',{waitUntil:'networkidle'});
            if((await p.locator('#root').evaluate(e=>e.children.length))<1)throw new Error('PANTALLA AZUL/root vacío');
            await p.waitForSelector('#alucia-smart-trigger',{timeout:5000});
            await p.locator('#alucia-smart-trigger').click();
            await p.waitForSelector('.alucia-smart-chat',{timeout:3000});
            const initial=await p.locator('.alucia-scroll').innerText();
            if(!/¿Qué quieres revisar de tu recibo\?/i.test(initial))throw new Error('Saludo natural no aplicado');
            if(/Ya cargué la demo|Pregúntame como hablas|Escenario activo/i.test(initial))throw new Error('Sigue el saludo técnico antiguo');
            if(await p.locator('.alucia-mic').count()<1||await p.locator('.alucia-speaker').count()<1)throw new Error('Falta voz I/O');
            await p.locator('.alucia-input').fill('quiero ver una oferta');await p.locator('.alucia-send').click();await p.waitForTimeout(900);
            let src=await p.locator('.alucia-offer-banner').getAttribute('src');
            if(!src.includes('lucia-normal-500.webp'))throw new Error('Banner normal incorrecto: '+src);
            if(await p.getByRole('button',{name:'Mejorar mi plan'}).count()<1)throw new Error('Falta Mejorar mi plan');
            await p.locator('.alucia-close').click();
            await p.evaluate(()=>{const x=document.createElement('button');x.textContent='Cobro por reconexión';document.body.appendChild(x);x.click();});
            await p.waitForTimeout(200);await p.locator('#alucia-smart-trigger').click();await p.waitForSelector('.alucia-smart-chat');
            let txt=await p.locator('.alucia-scroll').innerText();if(!/¿Qué quieres revisar de tu recibo\?/i.test(txt))throw new Error('Chat no reinició');
            if((await p.locator('.alucia-scroll .chat-message').count())!==1)throw new Error('Historial no se reinició');
            await p.locator('.alucia-input').fill('quiero ver una oferta');await p.locator('.alucia-send').click();await p.waitForTimeout(900);
            src=await p.locator('.alucia-offer-banner').getAttribute('src');if(!src.includes('lucia-reconnection-280.webp'))throw new Error('Banner reconexión incorrecto: '+src);
            await p.evaluate(()=>{const a=document.createElement('a');a.id='test-pdf';a.href='/recibos/recibo-agosto-2026.pdf';document.body.appendChild(a);});await p.waitForTimeout(200);
            const href=await p.locator('#test-pdf').getAttribute('href');if(!href.includes('/recibos/reconnection/recibo-agosto-2026.pdf'))throw new Error('PDF no cambió de escenario: '+href);
            const pdf=await p.request.get('http://127.0.0.1:3000/recibos/reconnection/recibo-agosto-2026.pdf');if(!pdf.ok())throw new Error('PDF reconexión no sirve');
            if(errors.length)throw new Error('Page errors: '+errors.join(' | '));
            console.log('OK V4: UI intacta, saludo natural, banners finales, voz, reset y recibos');
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          kill $APP_PID || true;kill $LUCIA_PID || true
