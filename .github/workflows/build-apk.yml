name: Build SUSANA APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - run: gradle clean :app:assembleDebug --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk SUSANA-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SUSANA-apk
          path: SUSANA-debug.apk
          if-no-files-found: error
