name: Importar app Movistar completa

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/importar-movistar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Deudas-Erika
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar fuente editable verificada
        run: |
          git clone --depth 1 --branch feature/final-ui-react-editable https://github.com/SAEZ1205/1retomovistar.git "$RUNNER_TEMP/movistar-source"
          SRC="$RUNNER_TEMP/movistar-source/MI_RECIBO_INTELIGENTE_FINAL_IGUAL_SITE/APP_EDITABLE"
          test -f "$SRC/package.json"
          test -f "$SRC/scripts/dev-full.mjs"
          test -f "$SRC/scripts/generate-demo-receipts.mjs"
          test -f "$SRC/backend/local-lucia-server.mjs"
          test -d "$SRC/src"
          test -d "$SRC/public"

      - name: Reemplazar contenido del repo por la app editable
        run: |
          SRC="$RUNNER_TEMP/movistar-source/MI_RECIBO_INTELIGENTE_FINAL_IGUAL_SITE/APP_EDITABLE"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a "$SRC"/. .

      - name: Configurar Vercel y guía corta
        run: |
          cat > vercel.json <<'EOF'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "framework": "vite",
            "buildCommand": "npm run build",
            "outputDirectory": "dist"
          }
          EOF
          cat > EMPIEZA_AQUI.txt <<'EOF'
          PROYECTO MOVISTAR - LUCIA

          1) npm install
          2) Copy-Item .env.local.example .env.local
          3) code .env.local
          4) Pega tu GEMINI_API_KEY en .env.local
          5) npm run dev:full
          6) Abre http://127.0.0.1:3000

          Si solo quieres ver la interfaz sin Gemini:
          npm run dev

          NO necesitas npm approve-scripts esbuild.
          EOF

      - name: Commit directo a main
        run: |
          git config user.name "SAEZ1205"
          git config user.email "saez123m@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar"
          else
            git commit -m "Instalar Movistar LucIA editable completa"
            git push origin main
          fi
