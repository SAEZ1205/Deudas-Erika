name: Generar recibos PDF validos

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generar-recibos-pdf.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab
      - run: python scripts/generar-recibos-pdf.py
      - name: Validar PDFs
        run: |
          test "$(find recibos/current recibos/proration recibos/reconnection recibos/discount -name '*.pdf' | wc -l)" -eq 24
          find recibos/current recibos/proration recibos/reconnection recibos/discount -name '*.pdf' -size +1500c | wc -l | grep -q '^24$'
      - name: Guardar PDFs
        run: |
          git config user.name 'SAEZ1205'
          git config user.email 'saez123m@gmail.com'
          git add recibos/current recibos/proration recibos/reconnection recibos/discount
          git commit -m 'Generar 24 recibos PDF por escenario' || exit 0
          git push origin main
