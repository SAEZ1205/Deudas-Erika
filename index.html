<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Control de Deudas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        margin: 0;
        padding: 20px;
    }

    h1 {
        text-align: center;
    }

    .container {
        max-width: 900px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
    }

    input, select, button {
        padding: 10px;
        margin: 5px;
        border-radius: 6px;
        border: 1px solid #ccc;
    }

    button {
        cursor: pointer;
        background: black;
        color: white;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }

    th, td {
        border-bottom: 1px solid #ddd;
        padding: 10px;
        text-align: center;
    }

    .actions button {
        margin: 2px;
        font-size: 12px;
    }
</style>
</head>
<body>

<div class="container" id="contenido">
    <h1>💰 Control de Deudas</h1>

 <input type="text" id="nombre" placeholder="Nombre">
<input type="number" id="monto" placeholder="Monto">

<label>Fecha de inicio:</label>
<input type="date" id="fechaInicio">

<label>Fecha límite:</label>
<input type="date" id="fechaLimite">

<input type="text" id="contexto" placeholder="Contexto (opcional)">

<select id="tipo">
    <option value="me deben">Me deben</option>
    <option value="debo">Debo</option>
</select>

    <button onclick="agregar()">Agregar</button>
    <button onclick="descargarPDF()">Descargar PDF</button>

    <table>
        <thead>
<tr>
    <th>Nombre</th>
    <th>Monto</th>
    <th>Inicio</th>
    <th>Límite</th>
    <th>Tipo</th>
    <th>Contexto</th>
    <th>Acciones</th>
</tr>
</thead>
        <tbody id="tabla"></tbody>
    </table>
</div>

<script>
let datos = JSON.parse(localStorage.getItem("deudas")) || [];

function guardar() {
    localStorage.setItem("deudas", JSON.stringify(datos));
}

function render() {
    const tabla = document.getElementById("tabla");
    tabla.innerHTML = "";

    datos.sort((a, b) => a.nombre.localeCompare(b.nombre));

    datos.forEach((d, i) => {
        tabla.innerHTML += `
        <tr>
            <td>${d.nombre}</td>
            <td>S/. ${d.monto}</td>
            <td>${d.fechaInicio}</td>
            <td>${d.fechaLimite}</td>
            <td>${d.tipo}</td>
            <td>${d.contexto}</td>
            <td class="actions">
                <button onclick="editar(${i})">Editar</button>
                <button onclick="eliminar(${i})">Eliminar</button>
            </td>
        </tr>`;
    });
}

function agregar() {
    const nombre = document.getElementById("nombre").value;
    const monto = document.getElementById("monto").value;
    const fechaInicio = document.getElementById("fechaInicio").value;
    const fechaLimite = document.getElementById("fechaLimite").value;
    const tipo = document.getElementById("tipo").value;

    let contexto = document.getElementById("contexto").value;

    if (!contexto) contexto = "Sin contexto";

    if (!nombre || !monto || !fechaInicio || !fechaLimite) {
        alert("Completa todos los campos obligatorios");
        return;
    }

    datos.push({ nombre, monto, fechaInicio, fechaLimite, tipo, contexto });

    guardar();
    render();
}

function eliminar(i) {
    datos.splice(i, 1);
    guardar();
    render();
}

function editar(i) {
    const nuevoNombre = prompt("Nuevo nombre:", datos[i].nombre);
    const nuevoMonto = prompt("Nuevo monto:", datos[i].monto);
    const nuevaFecha = prompt("Nueva fecha:", datos[i].fecha);

    if (nuevoNombre && nuevoMonto && nuevaFecha) {
        datos[i] = {
            nombre: nuevoNombre,
            monto: nuevoMonto,
            fecha: nuevaFecha,
            tipo: datos[i].tipo
        };
        guardar();
        render();
    }
}
function descargarPDF() {

    let debo = datos.filter(d => d.tipo === "debo");
    let meDeben = datos.filter(d => d.tipo === "me deben");

    // Ordenar ambos
    debo.sort((a, b) => a.nombre.localeCompare(b.nombre));
    meDeben.sort((a, b) => a.nombre.localeCompare(b.nombre));

    function crearTabla(titulo, lista) {
        let html = `
        <h2 style="text-align:center;">${titulo}</h2>
        <table style="width:100%; border-collapse: collapse; margin-bottom:20px;">
        <thead>
            <tr>
                <th style="border:1px solid black; padding:6px;">Nombre</th>
                <th style="border:1px solid black; padding:6px;">Monto</th>
                <th style="border:1px solid black; padding:6px;">Inicio</th>
                <th style="border:1px solid black; padding:6px;">Límite</th>
                <th style="border:1px solid black; padding:6px;">Contexto</th>
            </tr>
        </thead>
        <tbody>
        `;

        lista.forEach(d => {
            html += `
            <tr>
                <td style="border:1px solid black; padding:6px;">${d.nombre}</td>
                <td style="border:1px solid black; padding:6px;">S/. ${d.monto}</td>
                <td style="border:1px solid black; padding:6px;">${d.fechaInicio}</td>
                <td style="border:1px solid black; padding:6px;">${d.fechaLimite}</td>
                <td style="border:1px solid black; padding:6px;">${d.contexto}</td>
            </tr>
            `;
        });

        html += `</tbody></table>`;
        return html;
    }

    let contenido = `
    <h1 style="text-align:center;">Reporte de Deudas</h1>
    ${crearTabla("Deudas que DEBO", debo)}
    ${crearTabla("Deudas que ME DEBEN", meDeben)}
    `;

    let div = document.createElement("div");
    div.innerHTML = contenido;

    html2pdf().from(div).set({
        margin: 10,
        filename: "reporte_deudas.pdf",
        html2canvas: { scale: 2 },
        jsPDF: { orientation: "portrait" }
    }).save();
}

render();
</script>

</body>
</html>
