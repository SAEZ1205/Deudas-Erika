<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#019be1" />
    <title>Mi Movistar · Recibo inteligente</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      const root = document.getElementById('root')
      if (root) {
        const useDashboardLuciaHero = () => {
          const image = root.querySelector('img[alt="LucIA empleada"]')
          if (image && image.getAttribute('src') !== '/advisor/lucia-hero.webp') {
            image.setAttribute('src', '/advisor/lucia-hero.webp')
          }
        }

        new MutationObserver(useDashboardLuciaHero).observe(root, {
          childList: true,
          subtree: true,
        })

        useDashboardLuciaHero()
      }
    </script>
  </body>
</html>
